description: IPOT — hold one logged in session open and scrape the latest trading day once a day. Start by hand and scan the QR in the log, a restart means scanning again.

container:
  image: broksum-runtime:latest
  pull_policy: never
  working_dir: /workspace

secrets:
  - SUPABASE_URL
  - SUPABASE_KEY

# Its own queue, so nothing else waits behind a run that never ends
queue: ipot-session

# No timeout_sec on purpose: ending the run ends the IPOT login
hist_retention_days: 7

steps:
  - id: checkout
    run: runners clone

  - id: hold_session
    depends: [checkout]
    run: python ipot_service.py
