description: IPOT — hold one logged in session open and scrape the latest trading day once a day. Start by hand and scan the QR in the log, a restart means scanning again.

container:
  image: python:3.11-slim
  working_dir: /workspace
  env:
    - PYTHONUNBUFFERED: "1"
    - DEBIAN_FRONTEND: noninteractive

secrets:
  - SUPABASE_URL
  - SUPABASE_KEY
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_REGION
  - SES_FROM_EMAIL
  - ALERT_TO_EMAIL

# Its own queue, so nothing else waits behind a run that never ends
queue: ipot-session

# No timeout_sec on purpose: ending the run ends the IPOT login
hist_retention_days: 7

steps:
  # The stock image has no git, which `runners clone` needs
  - id: install_git
    run: sh -c 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates'

  - id: checkout
    depends: [install_git]
    run: runners clone

  # tzdata: the slim image has no timezone database for ZoneInfo("Asia/Jakarta")
  - id: install_deps
    depends: [checkout]
    run: >-
      sh -c "grep -vi '^playwright' requirements.txt > /tmp/requirements.txt
      && pip install --no-cache-dir -r /tmp/requirements.txt tzdata"

  - id: hold_session
    depends: [install_deps]
    run: python ipot_service.py
